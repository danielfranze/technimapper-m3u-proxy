services:
    technimapper-m3u-proxy:
        build: .
        # Or use the published, signed image (newest stable release; use a version tag like :1.5.0 to pin):
        # image: ghcr.io/danielfranze/technimapper-m3u-proxy:latest
        container_name: technimapper-m3u-proxy
        ports:
            # The server listens on 9191 by default. UI, playlist and /hdhr are reachable at http://<server-ip>:9191
            # (use the same port in Plex/Jellyfin). If you set PORT, change this mapping accordingly.
            - "9191:9191"
        volumes:
            # Directory mount (instead of a single file): allows atomic writes of mapping.json.
            # The container runs as UID 1000 - run once: chown -R 1000:1000 ./data
            - ./data:/app/data
            # Incorporates the local system time into the container
            - /etc/localtime:/etc/localtime:ro
        environment:
            - TZ=Europe/Berlin
            # Optional: protect UI and /api (/playlist.m3u8, /hdhr and /health stay public)
            # - ADMIN_USER=admin
            # - ADMIN_PASSWORD=change-me
            # Optional: allow receiver IPs outside RFC1918 (VPN/CGNAT)
            # - ALLOW_NON_PRIVATE_IP=true
            # Optional: behind a reverse proxy (number of proxy hops)
            # - TRUST_PROXY=1
            # Optional logging (LOG_LEVEL: error|warn|info, LOG_FORMAT: text|json)
            # - LOG_LEVEL=info
            # - LOG_FORMAT=json
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        mem_limit: 256m
        pids_limit: 200
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-9191}/health/live >/dev/null || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        stop_grace_period: 45s
