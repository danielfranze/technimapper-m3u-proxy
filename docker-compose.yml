services:
  technimapper-m3u-proxy:
    build: .
    container_name: technimapper-m3u-proxy
    ports:
      - "3000:3000"
    volumes:
      # Directory mount (instead of a single file): allows atomic writes of mapping.json
      - ./data:/app/data
      # Incorporates the local system time into the container
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Berlin
      # Optional: protect UI and /api (the playlist and /health stay public)
      # - ADMIN_USER=admin
      # - ADMIN_PASSWORD=change-me
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
