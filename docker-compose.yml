version: '3.8'

services:
  technisat-mapper:
    build: .
    container_name: technisat-mapper
    ports:
      - "3000:3000"
    volumes:
      # Saves the mapping.json file to the hard drive
      - ./mapping.json:/app/data/mapping.json
      # Incorporates the local system time into the container
      - /etc/localtime:/etc/localtime:ro
    environment:

      - TZ=Europe/Berlin
    restart: unless-stopped
