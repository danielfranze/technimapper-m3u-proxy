<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechniMapper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" 
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" 
          rel="stylesheet">

    <style>
        /* --- 1. Variables & Global Styles --- */
        :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-input: #2d2d2d;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --border: #333333;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 2. Header & Layout --- */
        main { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 24px; }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            font-size: 0.65rem;
            background: #374151;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* --- 3. Card & Form Elements --- */
        .card { background-color: var(--bg-card); border-radius: 8px; padding: 24px; border: 1px solid var(--border); }
        
        .card-header-wrapper { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            gap: 16px;
        }

        .card-title { 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin: 0; 
            color: #fff; 
            white-space: nowrap; 
            flex-shrink: 0;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.85rem; font-weight: 500; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper .material-icons-outlined { 
            position: absolute; left: 12px; color: var(--text-dim); font-size: 20px; 
        }

        .config-input {
            width: 100%; padding: 12px 16px 12px 44px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 0.9rem; background: var(--bg-input); 
            color: white; box-sizing: border-box; outline: none;
        }
        .config-input:focus { border-color: var(--accent); }

        /* --- 4. Buttons, Tables & Badges --- */
        .btn {
            font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.9rem;
            padding: 0 20px; height: 40px; border-radius: 6px; border: none; 
            cursor: pointer; display: inline-flex; align-items: center; 
            justify-content: center; gap: 8px; background-color: var(--accent); 
            color: white; transition: background-color 0.2s;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: var(--success); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { color: var(--text-dim); padding: 12px 16px; font-size: 0.85rem; text-align: left; border-bottom: 1px solid var(--border); }
        td { padding: 16px; font-size: 0.9rem; border-bottom: 1px solid var(--border); }

        .id-input {
            width: 80px; padding: 8px 12px; border: 1px solid var(--border);
            border-radius: 4px; text-align: center; background: var(--bg-input); 
            color: white; outline: none;
        }

        .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: 500; }
        .status-mapped { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .status-unmapped { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        .model-badge {
            font-size: 0.75rem; color: var(--accent); background: rgba(59, 130, 246, 0.1);
            padding: 4px 10px; border-radius: 20px; font-weight: 600; 
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .model-badge-pending {
            color: #fbbf24; background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        /* --- 5. Media Queries (Responsive) --- */
        @media (max-width: 900px) {
            .form-grid { grid-template-columns: 1fr !important; }
            #listCard > div { flex-direction: column; align-items: flex-start !important; gap: 12px; width: 100%; }
            table { table-layout: fixed; width: 100%; }
            td { height: 50px; padding: 0 4px !important; vertical-align: middle; }
            .status-badge { padding: 2px 4px; font-size: 0.6rem !important; }
            .id-input { width: 100%; padding: 6px 0; box-sizing: border-box; }
            th { font-size: 0.7rem !important; padding: 8px 4px !important; }
        }

        @media (max-width: 600px) {
            header { flex-direction: column; align-items: flex-start; gap: 12px; }
            header div { display: flex; flex-direction: column; gap: 6px; }
            header div span:nth-child(2) { display: none; }
            
            .card-header-wrapper { flex-direction: column; align-items: center; gap: 12px; margin-bottom: 24px; }
            .card-title { font-size: 0.95rem; white-space: nowrap; }
            #modelInfo { align-self: center; }
        }

        @media (min-width: 600px) and (max-width: 900px) {
            header { flex-direction: row; align-items: center; justify-content: space-between; }
            header div { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
            header div span:nth-child(2) { display: none; }
        }
    </style>
</head>

<body>
    <header>
        <h1>TechniMapper: M3U Proxy <span class="badge">v<span id="versionLabel">0.0.0</span></span></h1>
        <div>
            <span>Last Sync: <span id="last-sync-time" style="color: #fff;">Loading...</span></span>
            <span>|</span>
            <span>M3U: <a href="/playlist.m3u" target="_blank" id="m3uLink"
                style="color: var(--accent); text-decoration: none;">/playlist.m3u</a></span>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="card-header-wrapper">
                <div class="card-title" style="margin: 0;">Connection & Auto-Update Configuration</div>
                <div id="modelInfo" class="model-badge">Not detected yet</div>
            </div>
            <div class="form-grid">
                <div class="input-group">
                    <label>Receiver IP Address</label>
                    <div class="input-wrapper">
                        <span class="material-icons-outlined">settings_input_antenna</span>
                        <input type="text" id="receiverIp" class="config-input" value="192.168.178.28">
                    </div>
                </div>
                <div class="input-group">
                    <label>UPnP Port</label>
                    <div class="input-wrapper">
                        <span class="material-icons-outlined">settings</span>
                        <input type="text" id="receiverPort" class="config-input" value="9100">
                    </div>
                </div>
                <div class="input-group">
                    <label>Cron Schedule</label>
                    <div class="input-wrapper">
                        <span class="material-icons-outlined">schedule</span>
                        <input type="text" id="cronExpression" class="config-input" value="*/5 * * * *">
                    </div>
                </div>
            </div>
            <button class="btn" onclick="fetchChannels()">
                <span class="material-icons-outlined">refresh</span> Apply Settings & Fetch Channels
            </button>
            <p id="statusMsg" style="margin-top: 16px; font-weight: 500;"></p>
        </div>

        <div class="card" id="listCard" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <div class="card-title" style="margin: 0;">Channel ID Mapping</div>
                <button class="btn btn-success" onclick="saveMapping()">
                    <span class="material-icons-outlined">save</span> Save Mappings
                </button>
            </div>
            <table>
                <thead>
                    <tr style="background: #161616;">
                        <th>Status</th>
                        <th>Channel Name</th>
                        <th>Channel ID</th>
                    </tr>
                </thead>
                <tbody id="channelTableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        let currentMapping = {};
        let detectedChannels = [];
        const BACKEND_URL = window.location.origin;

        /* Updates the visual status badge based on detection results */
        function updateModelBadge(status, text) {
            const badge = document.getElementById('modelInfo');
            badge.className = 'model-badge';

            if (status === 'pending') {
                badge.classList.add('model-badge-pending');
                badge.innerText = text;
            } else if (status === 'success') {
                badge.innerText = "Detected: " + text;
                badge.style.background = "rgba(59, 130, 246, 0.1)";
                badge.style.color = "var(--accent)";
                badge.style.borderColor = "rgba(59, 130, 246, 0.2)";
            } else if (status === 'error') {
                badge.innerText = "Not detected";
                badge.style.background = "rgba(239, 68, 68, 0.1)";
                badge.style.color = "#f87171";
                badge.style.borderColor = "rgba(239, 68, 68, 0.2)";
            }
        }

        // Initialize UI and settings on page load
        document.addEventListener("DOMContentLoaded", () => {
            updateModelBadge('pending', 'Not detected yet');
            const linkElement = document.getElementById('m3uLink');
            if (linkElement) {
                linkElement.href = BACKEND_URL + '/playlist.m3u';
                linkElement.innerText = BACKEND_URL + '/playlist.m3u';
            }

            loadInitialConfig();
            updateSyncTime();
            setInterval(updateSyncTime, 30000);
        });

        // Fetches initial configuration from backend to populate inputs
        async function loadInitialConfig() {
            try {
                const res = await fetch(BACKEND_URL + '/api/get-config');
                const config = await res.json();
                // Update Version Label
                if (config.version) {
                    document.getElementById('versionLabel').innerText = config.version;
                }
                if (config.ip) document.getElementById('receiverIp').value = config.ip;
                if (config.port) document.getElementById('receiverPort').value = config.port;
                if (config.cronExpression) document.getElementById('cronExpression').value = config.cronExpression;
            } catch (e) { console.error("Initial config load failed"); }
        }

        // Queries backend for the last synchronization timestamp
        async function updateSyncTime() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const res = await fetch(BACKEND_URL + '/api/get-config', { signal: controller.signal });
                clearTimeout(timeoutId);

                const data = await res.json();
                const el = document.getElementById('last-sync-time');
                if (el) el.innerText = data.lastSync || "Never";
            } catch (e) {
                console.log("Sync status currently unavailable.");
            }
        }

        // Sends configuration to backend and triggers a new channel scan
        async function fetchChannels() {
            const statusMsg = document.getElementById('statusMsg');
            const listCard = document.getElementById('listCard'); // Reference to the table card
            const ip = document.getElementById('receiverIp').value.trim();
            const port = document.getElementById('receiverPort').value.trim();
            const cronExpression = document.getElementById('cronExpression').value.trim();

            statusMsg.innerText = `Saving configuration and querying TechniSat receiver...`;
            statusMsg.style.color = "var(--text-main)";

            try {
                const res = await fetch(BACKEND_URL + '/api/fetch-channels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip, port, cronExpression })
                });
                const data = await res.json();

                if (data.error) throw new Error(data.error);
                
                // Success: Update badge to blue and show the table
                updateModelBadge('success', data.detectedModel);
                
                detectedChannels = data.channels;
                currentMapping = data.mapping;

                statusMsg.innerText = `Success! ${detectedChannels.length} channels loaded.`;
                statusMsg.style.color = "#137333";
                renderTable(); // This will display the listCard
            } catch (err) {
                // Error: Update badge to red and hide the table
                updateModelBadge('error');
                listCard.style.display = 'none'; // Ensure the mapping table is hidden

                statusMsg.innerText = "Error: " + err.message;
                statusMsg.style.color = "#c5221f";
            }
        }

        // Dynamically renders the channel mapping table
        function renderTable() {
            const tbody = document.getElementById('channelTableBody');
            tbody.innerHTML = '';

            detectedChannels.sort().forEach(name => {
                const assignedId = currentMapping[name] || '';
                const isMapped = assignedId !== '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <span class="status-badge ${isMapped ? 'status-mapped' : 'status-unmapped'}">
                            ${isMapped ? 'Mapped' : 'Unassigned'}
                        </span>
                    </td>
                    <td><strong>${name}</strong></td>
                    <td>
                        <input type="text" class="id-input" value="${assignedId}" 
                               onchange="updateId('${name}', this.value)" placeholder="-">
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('listCard').style.display = 'block';
        }

        // Updates the local mapping object when an ID input changes
        function updateId(name, value) {
            if (value === '') {
                delete currentMapping[name];
            } else {
                currentMapping[name] = parseInt(value);
            }
        }

        // Sends the updated channel mappings to the backend for storage
        async function saveMapping() {
            try {
                const res = await fetch(BACKEND_URL + '/api/save-mapping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mapping: currentMapping })
                });
                if (res.ok) {
                    alert('Successfully saved! Channel IDs are active in your M3U playlist.');
                    renderTable();
                }
            } catch (err) {
                alert('Error saving data to the backend.');
            }
        }
    </script>
</body>
</html>
