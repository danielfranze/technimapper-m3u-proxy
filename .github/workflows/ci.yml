name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build, vulnerability scan & smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t technimapper:ci .

      - name: Scan image with Trivy (HIGH/CRITICAL with available fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            technimapper:ci

      - name: Smoke test (health + 503 without playlist)
        run: |
          docker run -d --name tm -p 3000:3000 technimapper:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/playlist.m3u)
          test "$code" = "503"

      - name: Show container logs on failure
        if: failure()
        run: docker logs tm || true

      - name: Cleanup
        if: always()
        run: docker rm -f tm || true
