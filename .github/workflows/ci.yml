name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & dependency audit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Frontend type check (JSDoc)
        run: npm run check:frontend
      - name: Type checks (tests, helpers, e2e)
        run: npm run check:tests && npx tsc --noEmit -p e2e
      - name: Unit & integration tests
        run: npm test
      - name: Coverage report
        run: npm run coverage
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build, vulnerability scan & smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t technimapper:ci .

      - name: Scan image with Trivy (HIGH/CRITICAL with available fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            technimapper:ci

      - name: Smoke test (health, 503 without playlist, HDHomeRun endpoints)
        run: |
          docker run -d --name tm -p 9191:9191 technimapper:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9191/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9191/health | grep -q '"status"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9191/playlist.m3u8)
          test "$code" = "503"
          curl -fsS http://127.0.0.1:9191/hdhr/discover.json | grep -q '"BaseURL":"http://127.0.0.1:9191/hdhr"'
          test "$(curl -fsS http://127.0.0.1:9191/hdhr/lineup.json)" = "[]"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9191/hdhr/stream/1)
          test "$code" = "404"

      - name: Show container logs on failure
        if: failure()
        run: docker logs tm || true

      - name: Cleanup
        if: always()
        run: docker rm -f tm || true
